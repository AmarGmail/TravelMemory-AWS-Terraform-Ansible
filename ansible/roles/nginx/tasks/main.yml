
---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create TravelMemory web root
  ansible.builtin.file:
    path: /var/www/travelmemory
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy React production build
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../frontend/build/"
    dest: /var/www/travelmemory/
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"
  notify: Reload Nginx

- name: Install TravelMemory Nginx configuration
  ansible.builtin.template:
    src: travelmemory.conf.j2
    dest: /etc/nginx/sites-available/travelmemory
    owner: root
    group: root
    mode: "0644"
  notify: Reload Nginx

- name: Disable default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx

- name: Enable TravelMemory Nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/travelmemory
    dest: /etc/nginx/sites-enabled/travelmemory
    state: link
  notify: Reload Nginx

- name: Ensure Nginx is enabled and running
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

