
---
#ansible_python_interpreter: /opt/ansible-mongodb-venv/bin/python
ansible_python_interpreter: /usr/bin/python3
# MongoDB Community Edition
mongodb_major_version: "8.0"
mongodb_apt_key_url: "https://pgp.mongodb.com/server-8.0.asc"
mongodb_apt_keyring: "/usr/share/keyrings/mongodb-server-8.0.gpg"
mongodb_apt_repository: >-
  deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ]
  https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse
mongodb_service_name: mongod
